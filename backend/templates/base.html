<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Resume Review</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #333; }
      header { background: #003366; color: #fff; padding: 16px; }
      nav a { color: #fff; margin-right: 16px; text-decoration: none; }
      main { padding: 24px; max-width: 840px; margin: 0 auto; }
      .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 20px; }
      .error { color: #a00; }
      .success { color: #080; }
      .section { margin-top: 24px; }
      .section h3 { margin-bottom: 12px; }
      .tag-list { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
      .tag { display: inline-block; background: #eaf2ff; color: #003366; padding: 6px 10px; border-radius: 999px; font-size: 13px; }
      .list { margin: 0; padding-left: 18px; }
      .list li { margin-bottom: 8px; }
      label { display: block; margin-top: 16px; }
      input[type="text"], input[type="email"], input[type="password"], textarea { width: 100%; padding: 10px; border: 1px solid #ccd1d9; border-radius: 4px; margin-top: 8px; }
      button { margin-top: 20px; padding: 12px 20px; background: #003366; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
      button:hover { background: #002244; }
      pre { background: #f0f0f0; padding: 16px; border-radius: 4px; overflow-x: auto; }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="/">Home</a>
        {% if session.get('user') %}
          <a href="/dashboard">Dashboard</a>
          <a href="/history">History</a>
          <a href="/logout">Logout</a>
        {% else %}
          <a href="/login">Login</a>
          <a href="/signup">Sign up</a>
        {% endif %}
      </nav>
    </header>
    <main>
      <div class="card">
        {% block content %}{% endblock %}
      </div>
    </main>
  </body>
</html>
